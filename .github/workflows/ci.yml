name: ci

# Quality gate for the package: blocks the merge if lint, format, typecheck,
# build or tests fail.
on:
  pull_request:
  # Measured 2026-08-20 in pepito, the repo this workflow is modeled on: the
  # premise this trigger was built on was only half right. The release PR's
  # CREATION does trigger ci.yml through the pull_request event above, even
  # though release-please opens it with the default GITHUB_TOKEN —
  # GITHUB_TOKEN only blocks triggers on refs/commits IT pushes, not on the
  # pull_request event itself. What GITHUB_TOKEN does block is any later push
  # the bot makes to update its own branch (a new commit added to an existing
  # release PR): that push fires neither pull_request nor, it turns out, this
  # push trigger, since that push is also made with GITHUB_TOKEN. So this
  # trigger is a human-push escape hatch, not the guarantee it was designed
  # to be — the actual guarantee that the release PR's `quality` check
  # eventually reports is the manual workflow-run approval documented in
  # README.md (runs for the bot's PR land in `action_required` until a human
  # approves them). This trigger still earns its keep on any human push to a
  # matching branch. It's scoped to the branches release-please-action
  # creates (see branch-name.js in release-please:
  # `release-please--branches--<target-branch>`); in pepito that name also
  # carried a `--components--<name>` suffix even for a single-package repo,
  # which the glob below still matches.
  push:
    branches: ['release-please--**']
  # Deliberate, do not remove: re-runs the quality gate against an arbitrary
  # ref with no fabricated commit, and was used for exactly that when a
  # release PR was left with no check. Harmless here in a way it would not
  # be on the publish workflow: this workflow publishes nothing, holds no
  # secret and involves no OIDC identity, and only users with write access
  # can dispatch it, so the worst case is spent Actions minutes. On the
  # publishing workflow the same trigger is a documented npm trusted-
  # publisher validation mismatch risk, because it enters npm's OIDC claim
  # validation — that is why it was deliberately removed from that path
  # rather than kept for symmetry with this one.
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Keep in sync with the local toolchain that writes pnpm-lock.yaml.
          version: 10.13.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install package
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # Closes the tsconfig.build.json (types: []) blind spot: the typecheck
      # step above uses tsconfig.json, not the build one, so a broken dist/
      # could pass this gate unnoticed until a real consumer hits it.
      - name: Build
        run: pnpm run build

      - name: Tests
        run: pnpm run coverage
