version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '21:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # TypeScript majors are held until tsup bundles rollup-plugin-dts
      # >= 6.5.1; see https://github.com/yabbadabbadev/croupier/issues/9
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @types/node tracks the Node major in .nvmrc (24).
      - dependency-name: '@types/node'
        versions:
          - '>=25'
    groups:
      quality:
        patterns:
          - 'oxlint*'
          - 'prettier'
      build:
        patterns:
          - 'tsup'
          - 'typescript'
          - '@types/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
      runtime:
        patterns:
          - '@opencode-ai/plugin'
          - 'pixelmatch'
          - 'pngjs'
          - 'yaml'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '21:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns:
          - '*'
